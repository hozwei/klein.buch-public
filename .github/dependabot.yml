# Dependabot (Plan W12): wöchentliche Versions-Updates, gruppiert je Ökosystem.
# Pfade gelten im öffentlichen Repo (Wurzel = ). Dependabot liest diese Datei
# nur vom Standardzweig (main).
#
# Die PRs sind Hinweise: Übernommen wird eine Änderung im Entwicklungsordner und mit dem
# nächsten Veröffentlichen, nicht per Merge auf GitHub (ein fremder Commit ließe
# Veroeffentlichen.ps1 abbrechen). Sicherheits-Updates kommen weiter einzeln.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      # Typen müssen zur Laufzeit passen (Node 22 LTS im Image und in CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      js:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      # Basis-Images bleiben auf LTS-Linien (Node 22, Java 21); ein Wechsel der Linie
      # (z. B. Node 24, Java 25) ist eine bewusste Entscheidung, kein Routine-Update.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      basis-images:
        patterns: ["*"]
