# Release-Image (Plan W12, ADR 0039).
#
# Trockenlauf auf `phase-w`: Build mit SBOM- und Provenance-Attestierung, Smoke-Test,
# SBOM (syft), Scan (trivy), Quellarchiv „Quellen Dritter“ — Ergebnisse als
# Workflow-Artefakt. KEIN Push, KEINE Signatur, nur `contents: read`.
#
# Release auf Tags `v*`: dieselben Schritte, danach Push nach
# ghcr.io/<owner>/klein-buch:<CalVer>, cosign keyless, Digest + Quellarchiv + SBOM in den
# Release-Entwurf. Reihenfolge bauen → testen → Quellarchiv → Push → Signatur; ohne
# Quellarchiv kein Push.
#
# Gebaut wird ein OCI-Layout samt Attestierungen (der `docker`-Exporter von `--load`
# behält sie ohne containerd-Store nicht). Getestet wird derselbe Inhalt, per skopeo in
# den lokalen Docker geladen (Schicht-IDs verglichen); gepusht wird das Layout
# unverändert (`--preserve-digests`), der Digest muss dem gebauten Index entsprechen.
name: Release-Image

on:
  push:
    branches: [phase-w]
    tags: ['v*']

permissions:
  contents: read

# Neuer Push auf phase-w bricht den laufenden Trockenlauf ab; ein Release-Lauf nie.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  SYFT_VERSION: "1.55.0"
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  COSIGN_VERSION: "3.1.4"
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  dry-run:
    name: Trockenlauf (ohne Push und Signatur)
    if: github.ref == 'refs/heads/phase-w' && github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plattenplatz freigeben
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Werkzeuge laden (feste Versionen, SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p bin dl
          fetch() { curl -fsSL --retry 3 -o "dl/$1" "$2"; echo "$3  dl/$1" | sha256sum -c -; }
          fetch trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256"
          tar -xzf dl/trivy.tgz -C bin trivy
          fetch syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256"
          tar -xzf dl/syft.tgz -C bin syft
          echo "$PWD/bin" >> "$GITHUB_PATH"
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends skopeo; }
          skopeo --version

      - name: Version und Metadaten
        id: meta
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          [[ "$cargo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version in Cargo.toml: '$cargo_version'"; exit 1; }
          version="${cargo_version}-dev.${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "description=EÜR-Buchhaltung für §19-Kleinunternehmer (selbst gehostet). Lizenzen und Hinweise unter /legal/ der laufenden Instanz und in /usr/share/doc/klein-buch im Image. Quelltext der Komponenten Dritter im Archiv klein-buch-${version}-quellen-dritter.tar.zst (Trockenlauf; nicht veröffentlicht)."
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image bauen (OCI-Layout mit SBOM + Provenance, ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/image-oci,tar=false
          build-args: |
            KLEINBUCH_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            KLEINBUCH_BUILD_COMMIT=${{ github.sha }}
            KLEINBUCH_BUILD_TAG=
          labels: |
            org.opencontainers.image.title=Klein.Buch
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attestierungen prüfen, Image in Docker laden
        id: load
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/image-oci"
          skopeo inspect --raw "oci:$A" > "$RUNNER_TEMP/index.json"
          jq . "$RUNNER_TEMP/index.json"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 1' \
            "$RUNNER_TEMP/index.json" >/dev/null || { echo "Keine Attestierung (SBOM/Provenance) im Index"; exit 1; }
          echo "digest=sha256:$(sha256sum < "$RUNNER_TEMP/index.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          skopeo copy --quiet "oci:$A" docker-daemon:klein-buch:ci
          want=$(skopeo inspect --config "oci:$A" | jq -c '.rootfs.diff_ids')
          got=$(docker image inspect -f '{{json .RootFS.Layers}}' klein-buch:ci | jq -c .)
          test "$want" = "$got" || { echo "Geladenes Image weicht vom OCI-Layout ab"; exit 1; }

      - name: Smoke-Test
        env:
          EXPECT_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/image_smoke.sh klein-buch:ci

      - name: SBOM (syft, SPDX-JSON)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          syft scan docker:klein-buch:ci -o "spdx-json=$RUNNER_TEMP/dist/klein-buch-${VERSION}-sbom.spdx.json"

      # Ausnahmen begründet in .trivyignore (Wurzel des öffentlichen Repos).
      - name: Scan (trivy, CRITICAL/HIGH mit verfügbarem Fix)
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 --no-progress klein-buch:ci

      - name: Quellarchiv „Quellen Dritter“
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          KLEINBUCH_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          KLEINBUCH_BUILD_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/build_sources_archive.sh --image klein-buch:ci --version "$VERSION" --out "$RUNNER_TEMP/dist"

      - name: Artefakt (SBOM + Quellarchiv)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-trockenlauf-${{ steps.meta.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Release (Push, Signatur, Release-Entwurf)
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Releases nur aus main: ein Tag auf einem Arbeitszweig (z. B. phase-w) baut kein Image.
      - name: Tag-Commit liegt auf main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "Tag ${GITHUB_REF_NAME} zeigt nicht auf einen Commit von main — kein Release."; exit 1; }

      - name: Plattenplatz freigeben
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Werkzeuge laden (feste Versionen, SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p bin dl
          fetch() { curl -fsSL --retry 3 -o "dl/$1" "$2"; echo "$3  dl/$1" | sha256sum -c -; }
          fetch trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256"
          tar -xzf dl/trivy.tgz -C bin trivy
          fetch syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256"
          tar -xzf dl/syft.tgz -C bin syft
          fetch cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" "$COSIGN_SHA256"
          install -m 0755 dl/cosign bin/cosign
          echo "$PWD/bin" >> "$GITHUB_PATH"
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends skopeo; }
          skopeo --version

      # Tag v<CalVer> muss zur Version in Cargo.toml passen (die zeigt der Server an).
      - name: Version und Metadaten
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "Tag '$TAG' ist kein v<CalVer>"; exit 1; }
          version=${TAG#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          test "$cargo_version" = "$version" || { echo "Tag $TAG ≠ Cargo.toml $cargo_version"; exit 1; }
          {
            echo "version=$version"
            echo "description=EÜR-Buchhaltung für §19-Kleinunternehmer (selbst gehostet). Lizenzen und Hinweise unter /legal/ der laufenden Instanz und in /usr/share/doc/klein-buch im Image. Quelltext der Komponenten Dritter: Release-Asset klein-buch-${version}-quellen-dritter.tar.zst unter ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Ohne Cache: Das Release-Image entsteht vollständig aus dem Tag.
      - name: Image bauen (OCI-Layout mit SBOM + Provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
          no-cache: true
          pull: true
          outputs: type=oci,dest=${{ runner.temp }}/image-oci,tar=false
          build-args: |
            KLEINBUCH_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            KLEINBUCH_BUILD_COMMIT=${{ github.sha }}
            KLEINBUCH_BUILD_TAG=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=Klein.Buch
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Attestierungen prüfen, Image in Docker laden
        id: load
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/image-oci"
          skopeo inspect --raw "oci:$A" > "$RUNNER_TEMP/index.json"
          jq . "$RUNNER_TEMP/index.json"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 1' \
            "$RUNNER_TEMP/index.json" >/dev/null || { echo "Keine Attestierung (SBOM/Provenance) im Index"; exit 1; }
          echo "digest=sha256:$(sha256sum < "$RUNNER_TEMP/index.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          skopeo copy --quiet "oci:$A" docker-daemon:klein-buch:ci
          want=$(skopeo inspect --config "oci:$A" | jq -c '.rootfs.diff_ids')
          got=$(docker image inspect -f '{{json .RootFS.Layers}}' klein-buch:ci | jq -c .)
          test "$want" = "$got" || { echo "Geladenes Image weicht vom OCI-Layout ab"; exit 1; }

      - name: Smoke-Test
        env:
          EXPECT_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/image_smoke.sh klein-buch:ci

      - name: SBOM (syft, SPDX-JSON)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          syft scan docker:klein-buch:ci -o "spdx-json=$RUNNER_TEMP/dist/klein-buch-${VERSION}-sbom.spdx.json"

      - name: Scan (trivy, CRITICAL/HIGH mit verfügbarem Fix)
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 --no-progress klein-buch:ci

      - name: Quellarchiv „Quellen Dritter“
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          KLEINBUCH_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          KLEINBUCH_BUILD_COMMIT: ${{ github.sha }}
          KLEINBUCH_BUILD_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/build_sources_archive.sh --image klein-buch:ci --version "$VERSION" --out "$RUNNER_TEMP/dist"

      - name: Anmelden bei ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Image pushen (nur mit Quellarchiv)
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.sources.outputs.archive }}
          BUILT_DIGEST: ${{ steps.load.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE" && test -s "$ARCHIVE" || { echo "Kein Quellarchiv — kein Push"; exit 1; }
          repo="ghcr.io/${OWNER,,}/klein-buch"
          if skopeo inspect --raw "docker://${repo}:${VERSION}" > "$RUNNER_TEMP/remote.json" 2>/dev/null; then
            remote="sha256:$(sha256sum < "$RUNNER_TEMP/remote.json" | cut -d' ' -f1)"
            test "$remote" = "$BUILT_DIGEST" || { echo "${repo}:${VERSION} existiert schon mit anderem Inhalt ($remote)"; exit 1; }
            echo "${repo}:${VERSION} ist bereits dieser Build — kein erneuter Push"
            digest=$remote
          else
            skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/digest" \
              "oci:$RUNNER_TEMP/image-oci" "docker://${repo}:${VERSION}"
            digest=$(cat "$RUNNER_TEMP/digest")
            test "$digest" = "$BUILT_DIGEST" || { echo "Gepushter Digest $digest ≠ gebauter $BUILT_DIGEST"; exit 1; }
          fi
          { echo "repo=$repo"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"

      - name: Signieren (cosign keyless) und prüfen
        env:
          REPO: ${{ steps.push.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REPO}@${DIGEST}"
          cosign verify --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${REPO}@${DIGEST}" >/dev/null
          echo "Signatur geprüft: ${REPO}@${DIGEST}"

      - name: Release-Entwurf (Digest, Quellarchiv, SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ steps.push.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          printf '%s:%s\n%s@%s\n' "$REPO" "$VERSION" "$REPO" "$DIGEST" > "$dist/klein-buch-${VERSION}-image.txt"
          {
            echo "## Image"
            echo
            echo '```'
            echo "${REPO}:${VERSION}"
            echo "${REPO}@${DIGEST}"
            echo '```'
            echo
            echo "Nur linux/amd64. Signatur prüfen:"
            echo
            echo '```'
            echo "cosign verify --certificate-identity ${CERT_IDENTITY} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com ${REPO}@${DIGEST}"
            echo '```'
            echo
            echo "## Lizenzen und Quellen"
            echo
            echo "- Quelltext von Klein.Buch (AGPL-3.0-or-later): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
            echo "- Quelltext der Komponenten Dritter: \`klein-buch-${VERSION}-quellen-dritter.tar.zst\` (dieses Release)"
            echo "- SBOM (SPDX-JSON): \`klein-buch-${VERSION}-sbom.spdx.json\`; SBOM und Provenance zusätzlich als Attestierung im Image-Index"
            echo "- Lizenzseite der laufenden Instanz: \`/legal/\`"
          } > "$RUNNER_TEMP/notes.md"
          shopt -s nullglob
          files=("$dist"/*)
          test "${#files[@]}" -ge 4
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "Klein.Buch ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
          fi
