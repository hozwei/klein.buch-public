name: CI

on:
  push:
    branches: [main, phase-w]
  pull_request:
    branches: [main]

# Ein neuer Push bricht den laufenden Lauf desselben Zweigs ab (der Token kann Läufe
# weder abbrechen noch neu starten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debug-Infos aus → deutlich kleinere target/-Artefakte (Runner-Disk schonen).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: cargo fmt + clippy + test
    if: github.repository == 'hozwei/klein.buch-public'
    # Fest auf 24.04: ubuntu-latest wechselt seit 19.10.2026 auf 26.04 (apt-Schritt hing dort).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # MailHog für den Block-5-E2E-Test (SMTP 1025, HTTP-API 8025). Der Test
    # erkennt einen fehlenden MailHog selbst und überspringt sich dann (no-op);
    # hier ist er also voll aktiv.
    services:
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Runner läuft sonst bei Tauri+Typst voll)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Die Ubuntu-Spiegel der Runner lieferten im Oktober 2026 zeitweise nur mit
      # Timeouts (bis 35 min). Daher: .deb-Pakete im Actions-Cache, Spiegelliste
      # mit Fallback (ein hängender Spiegel bricht nach 30 s ab, dann der nächste)
      # und ein festes Limit. Der Schritt entfällt mit Tauri (W5).
      - name: Cache apt-Pakete
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-24.04-tauri-v1

      - name: System-Deps (Tauri 2 on Ubuntu)
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          printf '%s\n' \
            http://azure.archive.ubuntu.com/ubuntu \
            http://archive.ubuntu.com/ubuntu \
            http://mirrors.edge.kernel.org/ubuntu | sudo tee /etc/apt/ubuntu-mirrors.txt >/dev/null
          sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/ubuntu-mirrors.txt#g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo -E apt-get $APT_OPTS update
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo -E apt-get $APT_OPTS install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  frontend:
    name: pnpm lint + svelte-check + vitest
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # Version aus "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm lint

      - name: vitest
        run: pnpm test

      # LICENSE muss der unveränderte AGPL-3.0-Volltext sein (gnu.org, Stand 23.10.2026).
      - name: LICENSE = AGPL-3.0-Volltext, COPYRIGHT vorhanden
        run: |
          echo "0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0  -" > "$RUNNER_TEMP/license.sha256"
          tr -d '\r' < LICENSE | sha256sum -c "$RUNNER_TEMP/license.sha256"
          test -s COPYRIGHT
