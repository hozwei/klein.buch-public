name: CI

on:
  push:
    branches: [main, phase-w]
  pull_request:
    branches: [main]

# Ein neuer Push bricht den laufenden Lauf desselben Zweigs ab (der Token kann Läufe
# weder abbrechen noch neu starten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debug-Infos aus → deutlich kleinere target/-Artefakte (Runner-Disk schonen).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: cargo fmt + clippy + test
    if: github.repository == 'hozwei/klein.buch-public'
    # Fest auf 24.04: ubuntu-latest wechselt seit 19.10.2026 auf 26.04 (apt-Schritt hing dort).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Mailpit für den SMTP-E2E-Test `tests/e2e_test.rs` (SMTP 1025, HTTP-API 8025;
    # bis Lauf F7a MailHog, W14-021). Der Test erkennt einen fehlenden Mailpit selbst
    # und überspringt sich dann (no-op); hier ist er also voll aktiv. Image per Digest
    # (Index aus der Registry, 25.10.2026); legal/check_base_images.py prüft, dass
    # jedes Service-Image einen Digest trägt.
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports:
          - 1025:1025
          - 8025:8025
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (Runner läuft sonst bei Typst + SQLCipher voll)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Keine System-Pakete nötig: seit W5 ohne Tauri (kein WebKitGTK), seit W8 ohne
      # `keyring` (kein libdbus), seit W12 `zip` nur mit Deflate (kein lzma-sys);
      # SQLCipher und OpenSSL übersetzt libsqlite3-sys selbst (perl/make sind da).

      # Die Action liest den Kanal sonst aus der Ref; bei SHA-Pin daher `toolchain`.
      # Die feste Version kommt ohnehin aus src-tauri/rust-toolchain.toml.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable-Zweig, Stand 24.10.2026
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  frontend:
    name: pnpm lint + svelte-check + vitest
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version aus "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm lint

      - name: vitest
        run: pnpm test

      # Der ZAP-API-Scan (security.yml) beschreibt die Commands mit diesem Skript;
      # ein Bruch fiele sonst erst im Sicherheits-Gate auf (Lauf F6-fix).
      - name: OpenAPI aus der Registry (ZAP-Scan)
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/openapi_from_registry.py" http://localhost:8080 > "$RUNNER_TEMP/openapi.json"
          python3 -I -c 'import json, sys; d = json.load(open(sys.argv[1])); assert len(d["paths"]) >= 100, len(d["paths"])' "$RUNNER_TEMP/openapi.json"

      # Wie die Stufe „web“ im Dockerfile: SPA nach build/ und die Lizenzliste
      # der JS-Pakete im Bundle (Vite-Plugin) für /legal/ (Lauf F6c).
      - name: SPA-Build + Lizenzliste
        run: |
          pnpm build
          test -s build/index.html
          test -s build/legal/js-licenses.json
          # Die Prüfliste der Lizenzseite im Image-Smoke (image_smoke.sh, „for js in …“)
          # nennt genau die Pakete des Bundles (Lauf F7a).
          python3 -I -c 'import json, re, sys; names = {p["name"] for p in json.load(open("build/legal/js-licenses.json"))}; m = re.search(r"^for js in (.+); do$", open(sys.argv[1], encoding="utf-8").read(), re.M); listed = set(m.group(1).split()); assert names == listed, (sorted(names), sorted(listed))' "$GITHUB_WORKSPACE/.github/scripts/image_smoke.sh"

      # LICENSE muss der unveränderte AGPL-3.0-Volltext sein (gnu.org, Stand 23.10.2026).
      - name: LICENSE = AGPL-3.0-Volltext, COPYRIGHT vorhanden
        run: |
          echo "0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0  -" > "$RUNNER_TEMP/license.sha256"
          tr -d '\r' < LICENSE | sha256sum -c "$RUNNER_TEMP/license.sha256"
          test -s COPYRIGHT

  # ---------------------------------------------------------------------------
  # Gates (Plan W12): Lieferkette, Geheimnisse, Java-Inventar. Werkzeuge mit festen
  # Versionen aus den GitHub-Releases, geprüft per SHA-256.
  # ---------------------------------------------------------------------------
  rust-supply-chain:
    name: cargo deny + cargo audit
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Werkzeuge laden (feste Versionen, SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL --retry 3 -o deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tgz" | sha256sum -c -
          tar -xzf deny.tgz --strip-components=1 -C bin \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          curl -fsSL --retry 3 -o audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          echo "${CARGO_AUDIT_SHA256}  audit.tgz" | sha256sum -c -
          tar -xzf audit.tgz --strip-components=1 -C bin \
            "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit"
          echo "$PWD/bin" >> "$GITHUB_PATH"

      # Toolchain aus rust-toolchain.toml (cargo metadata für cargo deny).
      - name: Rust-Toolchain
        run: cargo --version

      # Allowlist und begründete Ausnahmen: src-tauri/deny.toml.
      - name: cargo deny check advisories licenses
        run: cargo deny --locked check advisories licenses

      # Prüft das ganze Cargo.lock (alle Plattformen). Ausnahmen wie in deny.toml
      # ([advisories] ignore) — beide Listen gemeinsam pflegen.
      - name: cargo audit
        run: |
          cargo-audit audit --file Cargo.lock \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  # Laufzeit- und Entwicklungsabhängigkeiten blockierend ab „high“ (Lauf F7a): Die
  # Entwicklungswerkzeuge laufen in CI und beim Bau des Images (Lieferkette des
  # SPA-Bundles). Begründete Ausnahmen nur über `auditConfig.ignoreGhsas` in
  # pnpm-workspace.yaml (Kommentar mit Grund und Ablaufdatum).
  js-audit:
    name: pnpm audit (prod + dev)
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: pnpm audit --prod --audit-level high
        run: pnpm audit --prod --audit-level high

      - name: pnpm audit --audit-level high (mit Entwicklungsabhängigkeiten)
        run: pnpm audit --audit-level high

  secrets:
    name: gitleaks
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gitleaks laden (feste Version, SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p bin && tar -xzf gitleaks.tgz -C bin gitleaks
          echo "$PWD/bin" >> "$GITHUB_PATH"

      # Arbeitsbaum des Checkouts (ohne Lizenzschlüssel, ohne Token). Funde werden
      # im Log geschwärzt.
      - name: gitleaks dir
        run: gitleaks dir . --redact --no-banner --verbose --max-target-megabytes 5

  java-inventory:
    name: Inventar (Java-Komponenten, Basis-Images)
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java-Inventar (pom.properties ↔ THIRD-PARTY-JAVA.md)
        run: python3 -I legal/check_java_inventory.py

      - name: Basis-Images (Dockerfile ↔ versions.json)
        run: python3 -I legal/check_base_images.py
