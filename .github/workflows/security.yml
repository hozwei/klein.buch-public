# Sicherheits-Scan des Images (Plan W14): Härtung per docker inspect/exec,
# Abnahme-Ablauf, OWASP ZAP Baseline + API-Scan mit Sitzung, Gate über
# .github/zap-ausnahmen.tsv. Kein Push, nur `contents: read`.
name: Security-Scan

on:
  push:
    branches: [phase-w]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ZAP + Härtung gegen das Image
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plattenplatz freigeben
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image bauen (ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: klein-buch:scan
          build-args: |
            KLEINBUCH_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            KLEINBUCH_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Scan
        run: bash .github/scripts/security_scan.sh klein-buch:scan

      - name: ZAP-Berichte
        if: always() && env.ZAP_REPORTS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-berichte
          path: ${{ env.ZAP_REPORTS }}
          if-no-files-found: warn
          retention-days: 14
