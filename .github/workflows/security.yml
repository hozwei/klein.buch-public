# Sicherheits-Scan des Images (Plan W14): Härtung per docker inspect/exec,
# Abnahme-Ablauf, OWASP ZAP Baseline + API-Scan mit Sitzung, Gate über
# .github/zap-ausnahmen.tsv. Kein Push, nur `contents: read`.
name: Security-Scan

on:
  push:
    branches: [phase-w]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ZAP + Härtung gegen das Image
    if: github.repository == 'hozwei/klein.buch-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Plattenplatz freigeben
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image bauen (ohne Push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: klein-buch:scan
          build-args: |
            KLEINBUCH_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            KLEINBUCH_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Scan
        run: bash .github/scripts/security_scan.sh klein-buch:scan

      - name: ZAP-Berichte
        if: always() && env.ZAP_REPORTS != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-berichte
          path: ${{ env.ZAP_REPORTS }}
          if-no-files-found: warn
          retention-days: 14
