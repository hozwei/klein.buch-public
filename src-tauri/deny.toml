# cargo-deny (Plan W12, Gate „rust-supply-chain“ in .github/workflows/ci.yml):
#
#   cargo deny --locked check advisories licenses
#
# Geprüft wird der Abhängigkeitsgraph des Server-Binaries im Image
# (x86_64-unknown-linux-gnu, ohne dev-dependencies). `cargo audit` im selben Job
# prüft zusätzlich das ganze Cargo.lock; seine `--ignore`-Liste in ci.yml muss
# `[advisories] ignore` unten entsprechen.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
exclude-dev = true

[advisories]
# Unmaintained-Hinweise nur für direkte Abhängigkeiten als Fehler; transitive (heute
# u. a. über typst: bincode, paste, rustybuzz, ttf-parser, unsafe-libyaml, yaml-rust)
# erscheinen als Warnung und kommen mit Updates der direkten Abhängigkeit weg.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# Jede Ausnahme mit Begründung; bei jedem Update der betroffenen Crate neu prüfen.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin): kein Fix verfügbar. rsa kommt über russh (SFTP-Client, Signatur mit einem RSA-Nutzerschlüssel einmal je Verbindung) und sqlx-mysql (nicht genutzt); der Angriff braucht sehr viele beobachtbare Privatschlüssel-Operationen. Ed25519-Schlüssel sind empfohlen." },
    { id = "RUSTSEC-2026-0367", reason = "zip: betrifft nur ZipArchive::extract/ZipStreamReader::extract (SUID/SGID-Bits). Klein.Buch entpackt Backups und Exporte über by_name/by_index_raw in den Speicher, extract wird nicht aufgerufen. Fix erst in zip 9 (inkompatible API)." },
    { id = "RUSTSEC-2026-0368", reason = "zip: betrifft nur ZipArchive::extract (Symlink-Ziele außerhalb des Zielordners); extract wird nicht aufgerufen. Fix erst in zip 9." },
    { id = "RUSTSEC-2026-0369", reason = "zip: betrifft nur extract (Unix-Rechte über Symlinks); extract wird nicht aufgerufen. Fix erst in zip 9." },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.36 nur noch über typst 0.13 → hayagriva → citationberg (CSL-Stile/-Locales). Klein.Buchs eigener E-Rechnungs-Parser nutzt quick-xml 0.42 (behoben). citationberg liest nur die eingebetteten CSL-Daten und CSL-/Bibliografie-Dateien, die eine Typst-Vorlage ausdrücklich lädt; Vorlagen pflegt nur der Betreiber, Belegdaten gelangen escaped (AST, kein Markup) in Typst. Weg mit dem Update auf typst ≥ 0.14." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.36 über citationberg (wie RUSTSEC-2026-0194); citationberg nutzt keinen NsReader auf Nutzereingaben. Weg mit typst ≥ 0.14." },
]

[licenses]
# Wie about.toml: Build-Abhängigkeiten landen nicht im ausgelieferten Binary.
include-build = false
confidence-threshold = 0.8
# Dieselbe Allowlist wie `accepted` in about.toml (Begründung je Eintrag dort) —
# beide gemeinsam pflegen.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
# Unbenutzte Einträge der gemeinsamen Allowlist sind kein Fehler.
unused-allowed-license = "allow"

# Die Eigen-Crate (AGPL-3.0-or-later, `publish = false`) ist keine Drittkomponente.
[licenses.private]
ignore = true
