[package]
name = "klein-buch"
version = "2026.11.1"
description = "Lokale EÜR-Buchhaltung für deutsche §19-Kleinunternehmer"
authors = ["Manuel Schmid <schmidm@wildbach-computerhilfe.de>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hozwei/klein.buch-public"
# Klein.Buch wird NICHT nach crates.io veröffentlicht; Distribution läuft über
# das Docker-Image (ADR 0039). Der Marker macht das explizit und sorgt nebenbei
# dafür, dass `cargo about generate` die eigene Crate ignoriert
# (about.toml: `private = { ignore = true }`).
publish = false

[lib]
name = "klein_buch_lib"
crate-type = ["rlib"]

# Einziger Einstieg (Plan W5): HTTP-Server bzw. Subcommands (`healthcheck`).
[[bin]]
name = "klein-buch-server"
path = "src/main.rs"

[dependencies]
# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
# CancellationToken + TaskTracker für das geordnete Herunterfahren (Plan W5.6).
tokio-util = { version = "0.7", features = ["rt", "io"] }
# Stream-Adapter für gestreamte Downloads/Uploads (W7).
futures-util = "0.3"

# --- HTTP-Server (Plan W5, ADR 0039) ---
# axum als Router; die Verbindungen bedient hyper direkt (eigene Annahme-
# Schleife), weil `axum::serve` keinen Header-Read-Timeout kennt (W5.8).
# `multipart` für POST /api/upload/{art} (Plan W7).
axum = { version = "0.8", features = ["multipart"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# ServeDir/ServeFile für die SPA, CatchPanicLayer (ASVS 7.4.3, Lauf F4b);
# kein CorsLayer (Plan W5.7).
tower-http = { version = "0.6", features = ["fs", "catch-panic"] }
# Freier Platz vor Uploads (statvfs, Plan W7); ohne unsafe.
rustix = { version = "1", features = ["fs", "process"] }

# --- Persistence ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "tls-rustls",
] }

# --- SQLCipher: Verschlüsselung der DB at Rest (ADR 0035, Block G1-ENC) ---
# sqlx-sqlite 0.8.6 linkt libsqlite3-sys 0.30.1 (verifiziert via Cargo.lock).
# Eine DIREKTE Dep auf EXAKT diese Version mit dem SQLCipher-Feature zwingt Cargos
# Feature-Unification über den ganzen Graph: sqlx erhält damit eine SQLCipher-
# fähige SQLite-Lib statt der Vanilla-`bundled`. `PRAGMA key` ent-/verschlüsselt
# die DB dann seitenweise (db::open_pool). Schlüssel-Ableitung: SQLCipher-eigenes
# PBKDF2-HMAC-SHA512, Salt im DB-Header → selbstbeschreibende, cross-OS-portable
# Datei (ADR-0035-Amendment 2026-05-24, gegen Argon2id-Raw-Key entschieden).
# `-vendored-openssl`: OpenSSL wird mitkompiliert → self-contained, kein System-
# OpenSSL nötig (wichtig für Win+Mac-Auslieferung). BUILD-TOOL-PFLICHT am Host:
# Perl + (Windows-MSVC) NASM — wie bereits für aws-lc-rs/reqwest dokumentiert.
# Falls EXAKT-Pin bricht (sqlx-Update): `cargo tree -i libsqlite3-sys` muss GENAU
# EINE Version zeigen, sonst greift die Unification nicht.
libsqlite3-sys = { version = "=0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
# Dasselbe (vendored) OpenSSL wie SQLCipher, nur für `openssl_sys::init()`:
# Initialisierung mit OPENSSL_INIT_NO_ATEXIT (siehe `db::init_crypto`).
openssl-sys = "0.9"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Time / IDs ---
chrono = { version = "0.4", features = ["serde"] }
# Zeitzone fest Europe/Berlin (Plan W1.8, E12), unabhängig von der Prozess-TZ.
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# --- Cryptography ---
# SHA-256 (Archiv, Backup, Manifeste) und HMAC (TOTP, Gerätecookie) auf derselben
# RustCrypto-Linie wie russh (Lauf F6b: sha2 0.11, hmac 0.13, sha1 0.11). Hex-Ausgabe
# nur über `crate::hash::sha256_hex`; Known-Answer-Tests sichern das gespeicherte Format.
sha2 = "0.11"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
# Geheimnisse (Passphrase-Kopien) im RAM nach Gebrauch überschreiben.
zeroize = "1"
# TOTP (RFC 6238, Plan W6): HMAC-SHA1 über den Zeitschritt, konstantzeitiger
# Vergleich, Base32-Geheimnis, QR-Code als SVG (lokal erzeugt, kein Dienst).
hmac = "0.13"
sha1 = "0.11"
subtle = "2"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# CIDR-Liste der vertrauten Reverse-Proxys (KLEIN_BUCH_TRUSTED_PROXIES, W6).
ipnet = "2"

# --- XML / Templates ---
quick-xml = { version = "0.42", features = ["serialize"] }
tera = "1"

# --- Markdown (Paket-Markup, Block P2) ---
# default-features = false → nur der Parser (kein HTML-Renderer; wir bauen Typst
# + Klartext selbst aus dem AST, Injection-Schutz). Tabellen gehören nicht zum
# Subset (sie erscheinen als Text).
pulldown-cmark = { version = "0.12", default-features = false }

# --- PDF rendering ---
# lopdf: reine Rust-PDF-Manipulation für das Angebots-Bundle (Block 8) —
# führt Angebots-PDF + AGB-PDF + Datenschutz-PDF zu EINEM Druck-PDF zusammen.
# Merge-Rezept verifiziert gegen das offizielle examples/merge.rs (lopdf 0.40).
lopdf = "0.46"
# Typst 0.15 (Lauf F6b, ADR 0039 Nr. 139): Rechnungsbild gegen 0.13 per Text- und
# Pixelvergleich aller Vorlagen geprüft (`pdf::snapshot`). Vor jedem Typst-Update
# dieselben Referenz-PDFs vorher/nachher erzeugen und vergleichen.
typst = "0.15"
typst-pdf = "0.15"
# PagedDocument liegt seit Typst 0.15 in typst-layout (nicht mehr über typst re-exportiert).
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }

# --- Mail ---
# default-features = false → kein native-tls (würde mit rustls kollidieren).
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "hostname",
    "pool",
] }

# --- HTTP-Client (opt-in Versionsprüfung, W12) ---
# Seit Lauf F6 nur noch für `scheduler::update_check` (GET auf die GitHub-
# Releases) und die Binär-Tests; der Microsoft-Graph-Versand (Block 16) ist
# entfernt (E9, ADR 0039 Nr. 138). default-features = false → kein native-tls;
# rustls bleibt der einzige TLS-Stack (konsistent mit lettre/sqlx). `json`
# brauchen die Binär-Tests (`server_binary_test`).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
base64 = "0.22"
url = "2"

# --- Zugangsdaten ---
# Seit Plan W8 in der SQLCipher-DB (Tabelle `secrets`, Migration 0031); die
# `keyring`-Crate (OS-Schlüsselbund, im Container nicht vorhanden) und damit
# libdbus entfallen.

# --- SFTP-Backup-Ziel (ADR 0034, Block G1-BKP.3) ---
# russh = SSH in Rust, KEIN OpenSSL/libssh, keine System-Bibliothek. Transport-
# Krypto teils RustCrypto (siehe unten), das Krypto-Backend ist aber Pflicht:
# russh kompiliert nur mit `aws-lc-rs` oder `ring` (compile_error! in russh/lib.rs).
# Genutzt wird `aws-lc-rs` (Default-Feature von russh; C-Code über aws-lc-sys,
# statisch gelinkt, Build braucht einen C-Compiler) — aws-lc-rs kommt laut
# `cargo tree -i aws-lc-rs` allein über russh. russh-sftp setzt das
# SFTP-Subsystem auf einen russh-Channel (`channel.into_stream()`).
# ACHTUNG (im Decision Log + G1-BKP.3-Report dokumentiert): russh 0.60 zieht
# RustCrypto-Transport-Krypto der neuen Linie (heute aes-gcm 0.11, signature 3,
# ed25519-dalek 3; sha2 0.11 teilen wir seit Lauf F6b). aes-gcm 0.11 koexistiert
# SEMVER-GETRENNT mit unserem `aes-gcm 0.10` (Backup-Hülle) — keine Feature-
# Unification, kein Konflikt — und wird AUSSCHLIESSLICH für die SSH-
# Transportschicht genutzt, nie für Beleg-/Backup-Krypto. MITM-Schutz über
# Host-Key-Pinning (SHA256-Fingerprint, TOFU-bestätigt). Falls die RC-Fläche
# unerwünscht ist: auf eine stabile-Krypto-russh-Linie (~0.52) pinnen — dann ist
# die Client-API gegen genau diese Version neu zu verifizieren.
# 0.65 statt 0.64 (ADR 0042 V3c: CVE-2026-116794, Signatur über den SSH-Agent).
# Klein.Buch nutzt keinen SSH-Agent (nur Passwort-Auth); die genutzte Client-API
# ist unverändert, keine neuen transitiven Crates. Features ausdrücklich (= die
# Default-Features von russh 0.65), damit ein späteres Update sie nicht unbemerkt
# ändert: aws-lc-rs (Krypto-Backend, Pflicht), rsa (Prüfen von RSA-Host-Keys),
# flate2 (zlib-Kompression).
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
russh-sftp = "2.1"

# --- Archive ---
# Nur Deflate (Backups, Exporte) und Zeitstempel: ohne die Standard-Features
# entfallen zstd/bzip2/xz samt statisch gelinktem C-Code (W12); fremde ZIPs mit
# anderen Verfahren werden abgelehnt. zip 9 statt 2 (ADR 0042 V3b: CVE-2026-115905,
# CVE-2026-115909, RUSTSEC-2026-0367..0369); `deflate` = flate2 (zlib-rs) + zopfli.
zip = { version = "9.1", default-features = false, features = ["deflate", "time"] }

# --- Temp files (Sidecar-Bridges schreiben PDFs/XML in Temp-Dirs) ---
tempfile = "3"

# --- Error handling ---
thiserror = "1"
anyhow = "1"

# --- Logging ---
tracing = "0.1"
# Nur für sqlx::ConnectOptions::log_statements(LevelFilter): Statement-Logging aus,
# weil `PRAGMA key` die Passphrase enthält (Plan W2.3/W5.9).
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
# Nur Tests (W8-SMTP-CA, Lauf F5c): eigene Test-CA und TLS-Gegenstelle auf 127.0.0.1
# für den echten STARTTLS-Handshake mit `KLEIN_BUCH_SMTP_CA_FILE`. ring wie rustls im
# Produktivcode (kein aws-lc-rs).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Kein `panic = "abort"` im Server (Plan W5, ADR 0039): eine Panik beendet nur
# die betroffene Anfrage bzw. den Job (tokio fängt sie am Task-Ende), nicht den
# ganzen Prozess samt entsperrter Datenbank.

# Lauf F5a (ASVS V5.4.3 / 14.1.2): Überlaufprüfung auch im Release für den
# eigenen Crate. Die Domäne lehnt Beträge außerhalb der Grenzen vorher ab und
# summiert sättigend bzw. geprüft; bliebe trotzdem ein Überlauf, bricht die
# Anfrage mit einer Panik ab (CatchPanicLayer → 500, Transaktion zurückgerollt)
# statt still mit falschem Vorzeichen zu buchen. Abhängigkeiten unverändert.
[profile.release.package.klein-buch]
overflow-checks = true

# Lauf F3c: Abhängigkeiten im Dev-/Test-Profil optimiert übersetzen (das Test-
# Profil erbt von dev). Argon2id (64 MiB), SHA-256, AES-GCM, Deflate, SQLite
# (C-Teil von libsqlite3-sys über OPT_LEVEL) und Typst liefen sonst ohne
# Optimierung — Einrichten, Anmelden und Backups brauchten in den Server-Tests
# unter Volllast mehr als die 30-s-Grenze der Anfragen (503 „timeout“). Der
# eigene Crate bleibt bei opt-level 0 (schnelles Neuübersetzen); das
# Release-Profil ist unberührt.
[profile.dev.package."*"]
opt-level = 2
